name: Livestock Group Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: البحث عن المهتمين بالمواشي
        run: python discover.py

      - name: حفظ النتائج
        run: |
          git config user.name "livestock-automation"
          git config user.email "actions@github.com"
          git add leads.csv
          git diff --cached --quiet || git commit -m "Update livestock leads"
          git push
